[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whyloom"
version = "0.8.0"
description = "Trusted, graph-backed project memory for humans and coding agents"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ai-agents", "codebase", "context", "knowledge-graph", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
]
authors = [{ name = "Rafael Oliveira" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "PyYAML>=6.0",
  "pydantic>=2.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.9"]
# Optional tree-sitter grammars keep the base install small and offline while
# enabling multi-language symbol extraction on demand.
typescript = ["tree-sitter>=0.23", "tree-sitter-typescript>=0.23"]
javascript = ["tree-sitter>=0.23", "tree-sitter-javascript>=0.23"]
go = ["tree-sitter>=0.23", "tree-sitter-go>=0.23"]
rust = ["tree-sitter>=0.23", "tree-sitter-rust>=0.23"]
java = ["tree-sitter>=0.23", "tree-sitter-java>=0.23"]
csharp = ["tree-sitter>=0.23", "tree-sitter-c-sharp>=0.23"]
languages = [
  "tree-sitter>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-go>=0.23",
  "tree-sitter-rust>=0.23",
  "tree-sitter-java>=0.23",
  "tree-sitter-c-sharp>=0.23",
]

[project.scripts]
whyloom = "whyloom.cli:app"

[project.urls]
Homepage = "https://github.com/rafaelolsr/whyloom"
Repository = "https://github.com/rafaelolsr/whyloom.git"
Issues = "https://github.com/rafaelolsr/whyloom/issues"

[tool.setuptools.data-files]
"share/whyloom/skills/whyloom" = [
  "skills/whyloom/SKILL.md",
]
"share/whyloom/skills/whyloom/agents" = ["skills/whyloom/agents/openai.yaml"]
"share/whyloom/skills/whyloom-bootstrap" = [
  "skills/whyloom-bootstrap/SKILL.md",
]
"share/whyloom/skills/whyloom-bootstrap/agents" = ["skills/whyloom-bootstrap/agents/openai.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
