[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whyloom"
version = "0.5.1"
description = "Git-native, graph-backed project memory for humans and coding agents"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ai-agents", "codebase", "context", "knowledge-graph", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
]
authors = [{ name = "Rafael Oliveira" }]
dependencies = [
  "PyYAML>=6.0",
  "pydantic>=2.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.9"]

[project.scripts]
whyloom = "whyloom.cli:app"

[project.urls]
Homepage = "https://github.com/rafaelolsr/whyloom"
Repository = "https://github.com/rafaelolsr/whyloom.git"
Issues = "https://github.com/rafaelolsr/whyloom/issues"

[tool.setuptools.data-files]
"share/whyloom/skills/whyloom" = [
  "skills/whyloom/SKILL.md",
]
"share/whyloom/skills/whyloom/agents" = ["skills/whyloom/agents/openai.yaml"]
"share/whyloom/skills/whyloom-bootstrap" = [
  "skills/whyloom-bootstrap/SKILL.md",
]
"share/whyloom/skills/whyloom-bootstrap/agents" = ["skills/whyloom-bootstrap/agents/openai.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
