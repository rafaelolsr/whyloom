name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,languages]'
      - run: ruff check .
      - run: python -m pytest -q
      - run: python -m build
        if: matrix.python-version == '3.11'
      - run: python scripts/check_distribution.py dist/*.whl
        if: matrix.python-version == '3.11'
      - run: whyloom index --json
        if: matrix.python-version == '3.11'
      - run: whyloom doctor --json
        if: matrix.python-version == '3.11'
      - run: python evals/runner.py
        if: matrix.python-version == '3.11'
