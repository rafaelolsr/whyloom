version: 1
records_dir: .whyloom
database: .whyloom/cache/graph.sqlite
include:
  - "**/*.py"
exclude:
  - ".git/**"
  - ".whyloom/cache/**"
  - ".venv*/**"
  - "venv/**"
  - "venv-*/**"
  - ".tox/**"
  - ".nox/**"
  - "__pypackages__/**"
  - "**/site-packages/**"
  - "**/node_modules/**"
  - "build/**"
  - "dist/**"
max_depth: 2
max_items: 20
