version: 1
records_dir: .whyloom
database: .whyloom/cache/graph.sqlite
include:
  - "**/*.py"
  - "*.json"
  - "*.yaml"
  - "*.yml"
  - ".github/workflows/*.yaml"
  - ".github/workflows/*.yml"
  - "config/**/*.json"
  - "config/**/*.yaml"
  - "config/**/*.yml"
  - "configs/**/*.json"
  - "configs/**/*.yaml"
  - "configs/**/*.yml"
  - "deploy/**/*.json"
  - "deploy/**/*.yaml"
  - "deploy/**/*.yml"
  - "deployment/**/*.json"
  - "deployment/**/*.yaml"
  - "deployment/**/*.yml"
  - "infra/**/*.json"
  - "infra/**/*.yaml"
  - "infra/**/*.yml"
  - "infrastructure/**/*.json"
  - "infrastructure/**/*.yaml"
  - "infrastructure/**/*.yml"
  - "templates/**/*.json"
  - "templates/**/*.yaml"
  - "templates/**/*.yml"
exclude:
  - ".git/**"
  - ".whyloom/cache/**"
  - ".venv*/**"
  - "venv/**"
  - "venv-*/**"
  - ".tox/**"
  - ".nox/**"
  - ".mypy_cache/**"
  - ".pytest_cache/**"
  - ".ruff_cache/**"
  - ".cache/**"
  - ".import_linter_cache/**"
  - "__pypackages__/**"
  - "**/site-packages/**"
  - "**/node_modules/**"
  - "build/**"
  - "dist/**"
max_depth: 2
max_items: 20
