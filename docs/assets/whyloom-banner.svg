<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Whyloom — weave code and its reasoning into one graph">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="0.55" stop-color="#0d1420"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#f59e0b" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="thread2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>

  <!-- faint blueprint grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <path d="M0 110 H1280 M0 220 H1280 M0 330 H1280"/>
    <path d="M160 0 V440 M480 0 V440 M800 0 V440 M1120 0 V440"/>
  </g>

  <!-- converging threads: many sources on the left fold into one point -->
  <g fill="none" filter="url(#soft)">
    <path d="M-20 60  C 300 90, 520 200, 900 220"  stroke="url(#thread)"  stroke-width="2.2" opacity="0.8"/>
    <path d="M-20 130 C 300 150, 520 205, 900 220" stroke="url(#thread2)" stroke-width="2.2" opacity="0.8"/>
    <path d="M-20 200 C 300 205, 540 214, 900 220" stroke="url(#thread)"  stroke-width="2.4" opacity="0.9"/>
    <path d="M-20 270 C 300 255, 540 226, 900 220" stroke="url(#thread2)" stroke-width="2.2" opacity="0.8"/>
    <path d="M-20 340 C 300 320, 520 240, 900 220" stroke="url(#thread)"  stroke-width="2.2" opacity="0.7"/>
    <path d="M-20 410 C 300 380, 520 260, 900 220" stroke="url(#thread2)" stroke-width="2.0" opacity="0.6"/>
    <path d="M-20 95  C 320 120, 540 210, 900 220" stroke="url(#thread)"  stroke-width="1.4" opacity="0.5"/>
    <path d="M-20 305 C 320 300, 540 232, 900 220" stroke="url(#thread2)" stroke-width="1.4" opacity="0.5"/>
  </g>

  <!-- convergence node: the graph "gem" where threads resolve into one memory -->
  <g transform="translate(900 220)">
    <circle r="120" fill="url(#glow)"/>
    <g stroke="#5eead4" stroke-width="1.6" fill="none" opacity="0.85">
      <path d="M0 -70 L60 -22 L60 40 L0 74 L-60 40 L-60 -22 Z"/>
      <path d="M0 -70 L0 74 M-60 -22 L60 40 M60 -22 L-60 40"/>
    </g>
    <!-- graph nodes on the gem vertices -->
    <g fill="#5eead4">
      <circle cx="0" cy="-70" r="6"/>
      <circle cx="60" cy="-22" r="5"/>
      <circle cx="60" cy="40" r="5"/>
      <circle cx="0" cy="74" r="6"/>
      <circle cx="-60" cy="40" r="5"/>
      <circle cx="-60" cy="-22" r="5"/>
    </g>
    <circle r="9" fill="#fbbf24"/>
    <circle r="16" fill="none" stroke="#fbbf24" stroke-width="1.4" opacity="0.7"/>
  </g>

  <!-- wordmark + tagline -->
  <g transform="translate(300 200)">
    <text x="0" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="6" fill="url(#word)">WHYLOOM</text>
    <text x="4" y="42" font-family="'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" letter-spacing="1.5" fill="#94a3b8">Weave code and its reasoning into one graph.</text>
    <text x="4" y="76" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="2" fill="#5eead4" opacity="0.85">YOUR CODEBASE REMEMBERS WHY.</text>
  </g>
</svg>
